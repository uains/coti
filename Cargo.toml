[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
md-core = { path = "crates/md-core" }
md-document = { path = "crates/md-document" }
md-markdown = { path = "crates/md-markdown" }
md-editor = { path = "crates/md-editor" }
md-layout = { path = "crates/md-layout" }
md-render = { path = "crates/md-render" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"

# GPUI is intentionally absent from the active dependency graph during phases 0-7.
# When md-render/md-app adopt it, reuse the revision recorded by the original
# project scaffold: f4fe0be1f8c7974db07e01c5cd05bee0cf4eb8d9
# (see docs/ARCHITECTURE_DECISIONS.md, ADR-0001).
